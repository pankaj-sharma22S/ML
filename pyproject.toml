[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "amea"
version = "0.1.0"
description = "Autonomous ML Engineer Agent - Evidence-Driven ML Orchestration System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.10.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "polars>=1.0.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
